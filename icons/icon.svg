<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1d2eb6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <radialGradient id="cheek">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square with purple-blue gradient -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Decorative bg dots -->
  <circle cx="20" cy="20" r="2" fill="white" opacity="0.3"/>
  <circle cx="108" cy="22" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="22" cy="108" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="106" cy="106" r="1.2" fill="white" opacity="0.2"/>

  <!-- Memo paper shadow -->
  <rect x="29" y="34" width="70" height="78" rx="14" fill="#000" opacity="0.18"/>

  <!-- Memo paper -->
  <rect x="29" y="30" width="70" height="78" rx="14" fill="url(#paper)"/>

  <!-- Top accent band -->
  <path d="M29 30 Q29 30 29 30 L29 42 L99 42 L99 30 Q99 24 93 24 L35 24 Q29 24 29 30 Z" fill="#a89bd9"/>

  <!-- Pen clip (notebook spine) -->
  <rect x="56" y="18" width="16" height="10" rx="3" fill="#1d2eb6"/>
  <rect x="58" y="20" width="12" height="3" rx="1" fill="#a89bd9"/>

  <!-- Cute face: eyes (kawaii style with shine) -->
  <ellipse cx="50" cy="62" rx="5.5" ry="7" fill="#1d2eb6"/>
  <ellipse cx="78" cy="62" rx="5.5" ry="7" fill="#1d2eb6"/>
  <circle cx="51.8" cy="59.5" r="2" fill="white"/>
  <circle cx="79.8" cy="59.5" r="2" fill="white"/>
  <circle cx="49.5" cy="64.5" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="77.5" cy="64.5" r="0.8" fill="white" opacity="0.7"/>

  <!-- Pink cheeks -->
  <ellipse cx="42" cy="73" rx="5" ry="3" fill="url(#cheek)"/>
  <ellipse cx="86" cy="73" rx="5" ry="3" fill="url(#cheek)"/>

  <!-- Cute smile -->
  <path d="M55 76 Q64 84 73 76" stroke="#1d2eb6" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Tongue blip -->
  <ellipse cx="64" cy="80" rx="2" ry="1.5" fill="#f472b6" opacity="0.7"/>

  <!-- Text lines (transcript) -->
  <rect x="40" y="92" width="48" height="3" rx="1.5" fill="#c7cdf8"/>
  <rect x="40" y="99" width="36" height="3" rx="1.5" fill="#c7cdf8"/>

  <!-- AI sparkle (large) -->
  <g transform="translate(106, 38)">
    <path d="M0 -10 L2.6 -2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6 -2.6 Z" fill="#fde047"/>
    <circle cx="0" cy="0" r="2.5" fill="#fff7ed"/>
  </g>

  <!-- Small sparkle -->
  <g transform="translate(118, 60)">
    <path d="M0 -4 L1.2 -1.2 L4 0 L1.2 1.2 L0 4 L-1.2 1.2 L-4 0 L-1.2 -1.2 Z" fill="#fde047"/>
  </g>
  <g transform="translate(94, 100)">
    <path d="M0 -3 L0.9 -0.9 L3 0 L0.9 0.9 L0 3 L-0.9 0.9 L-3 0 L-0.9 -0.9 Z" fill="#fde047" opacity="0.8"/>
  </g>
</svg>
